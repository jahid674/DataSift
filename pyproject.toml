[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasift-fairness"
version = "0.1.0"
description = "Selective data expansion for model fairness using multi-armed bandits and influence functions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Jahid Hasan", email = "hasan89@purdue.edu"},
    {name = "Romila Pradhan", email = "rpradhan@purdue.edu"},
]
keywords = ["fairness", "data-acquisition", "influence-functions", "multi-armed-bandits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "build==1.2.2.post1", "wheel==0.45.1", "ruff==0.9.10"]
notebooks = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7", "seaborn==0.13.2"]

[project.urls]
Repository = "https://github.com/jahid674/DataSift"
Issues = "https://github.com/jahid674/DataSift/issues"
Paper = "https://doi.org/10.48786/edbt.2026.39"

[tool.setuptools]
packages = ["datasift"]
py-modules = ["Algorithms", "Classifier", "DatasetExt", "Misc", "metrics", "influence", "utils"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
datasift = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/reference", "notebooks"]
